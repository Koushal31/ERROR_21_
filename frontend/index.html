<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Film Crowdfunding - Projects</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Film Projects</h1>
  <nav>
    <a href="login.html">Login</a> |
    <a href="signup.html">Sign Up</a> |
    <a href="submit-project.html">Submit Project</a>
  </nav>
  <ul id="projects-list"></ul>

  <script src="app.js"></script>
  <script>
    async function loadProjects() {
      const projects = await fetch('/api/projects').then(res => res.json());
      const list = document.getElementById('projects-list');
      list.innerHTML = '';
      projects.forEach(p => {
        const li = document.createElement('li');
        li.innerHTML = `<a href="project.html?id=${p.id}">${p.title}</a> - Funds: $${p.fundsRaised} / $${p.fundingGoal}`;
        list.appendChild(li);
      });
    }
    loadProjects();
  </script>
</body>
</html>
